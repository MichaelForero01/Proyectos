<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban · Neon</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #050508;
  --surface:  #0d0d14;
  --surface2: #12121c;
  --border:   #1e1e2e;

  --text:       #e2e4f0;
  --text-muted: #5a5c78;
  --text-dim:   #2a2a3e;

  --neon-cyan:    #00f5ff;
  --neon-pink:    #ff2d78;
  --neon-yellow:  #f5ff00;
  --neon-green:   #00ff9f;
  --neon-purple:  #bf00ff;
  --neon-orange:  #ff6b00;

  /* Priorities */
  --high:   var(--neon-pink);
  --high-bg: rgba(255,45,120,0.08);
  --high-glow: 0 0 12px rgba(255,45,120,0.5);

  --mid:   var(--neon-yellow);
  --mid-bg: rgba(245,255,0,0.07);
  --mid-glow: 0 0 12px rgba(245,255,0,0.4);

  --low:   var(--neon-green);
  --low-bg: rgba(0,255,159,0.07);
  --low-glow: 0 0 12px rgba(0,255,159,0.4);

  /* Columns */
  --col-todo:     var(--neon-cyan);
  --col-progress: var(--neon-purple);
  --col-done:     var(--neon-green);

  --radius: 10px;
  --font-mono: 'Share Tech Mono', monospace;
  --font-main: 'Exo 2', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* scanline overlay */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
  pointer-events: none;
  z-index: 9999;
}

/* ── HEADER ── */
header {
  padding: 1.8rem 2.5rem 1.2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  position: relative;
}

header::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
}

.logo {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.logo h1 {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--neon-cyan);
  text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px rgba(0,245,255,0.3);
  line-height: 1;
}

.logo p {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
}

.header-right { display: flex; gap: 0.75rem; align-items: center; }

.nav-tabs {
  display: flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.tab-btn {
  padding: 0.5rem 1.1rem;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}

.tab-btn.active {
  background: rgba(0,245,255,0.1);
  color: var(--neon-cyan);
  text-shadow: 0 0 8px var(--neon-cyan);
}

.btn-add-main {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.6rem 1.2rem;
  background: transparent;
  border: 1px solid var(--neon-cyan);
  border-radius: 8px;
  color: var(--neon-cyan);
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  cursor: pointer;
  text-transform: uppercase;
  text-shadow: 0 0 8px var(--neon-cyan);
  box-shadow: 0 0 12px rgba(0,245,255,0.2), inset 0 0 12px rgba(0,245,255,0.05);
  transition: all 0.2s;
}

.btn-add-main:hover {
  background: rgba(0,245,255,0.1);
  box-shadow: 0 0 20px rgba(0,245,255,0.4), inset 0 0 20px rgba(0,245,255,0.1);
}

/* ── VIEWS ── */
.view { display: none; }
.view.active { display: block; }

/* ── BOARD ── */
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  padding: 2rem 2.5rem 3rem;
}

.column {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
  background: var(--surface);
}

.column.drag-over { box-shadow: 0 0 0 1px var(--neon-cyan), 0 0 30px rgba(0,245,255,0.15); border-color: var(--neon-cyan); }

.col-header {
  padding: 1rem 1.3rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.col-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0; height: 1px;
}

.column[data-col="todo"] .col-header::after    { background: var(--col-todo); box-shadow: 0 0 8px var(--col-todo); }
.column[data-col="progress"] .col-header::after { background: var(--col-progress); box-shadow: 0 0 8px var(--col-progress); }
.column[data-col="done"] .col-header::after     { background: var(--col-done); box-shadow: 0 0 8px var(--col-done); }

.col-title-wrap { display: flex; align-items: center; gap: 0.6rem; }

.col-name {
  font-size: 0.78rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
}

.column[data-col="todo"] .col-name    { color: var(--col-todo);     text-shadow: 0 0 8px var(--col-todo); }
.column[data-col="progress"] .col-name { color: var(--col-progress); text-shadow: 0 0 8px var(--col-progress); }
.column[data-col="done"] .col-name    { color: var(--col-done);     text-shadow: 0 0 8px var(--col-done); }

.col-count {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-muted);
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 20px;
}

.col-body {
  flex: 1; padding: 1rem;
  display: flex; flex-direction: column; gap: 0.75rem;
  min-height: 180px;
}

.drop-placeholder {
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  height: 70px;
  display: none;
  align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim);
}

.column.drag-over .drop-placeholder { display: flex; border-color: var(--neon-cyan); color: var(--neon-cyan); }

/* ── CARD ── */
.card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.9rem 1rem;
  cursor: grab;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  animation: cardIn 0.3s cubic-bezier(.34,1.56,.64,1) both;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: none; }
}

.card::before {
  content: ''; position: absolute;
  left: 0; top: 0; bottom: 0; width: 2px;
}

.card[data-priority="alta"]::before  { background: var(--high); box-shadow: var(--high-glow); }
.card[data-priority="media"]::before { background: var(--mid);  box-shadow: var(--mid-glow); }
.card[data-priority="baja"]::before  { background: var(--low);  box-shadow: var(--low-glow); }

.card[data-priority="alta"]  { border-color: rgba(255,45,120,0.2); }
.card[data-priority="media"] { border-color: rgba(245,255,0,0.15); }
.card[data-priority="baja"]  { border-color: rgba(0,255,159,0.15); }

.card:hover { transform: translateY(-2px); border-color: rgba(0,245,255,0.3); box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 20px rgba(0,245,255,0.05); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: 0.3; transform: scale(0.95); }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.4rem; }

.card-title { font-weight: 700; font-size: 0.88rem; line-height: 1.3; flex: 1; }

.card-actions { display: flex; gap: 0.15rem; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
.card:hover .card-actions { opacity: 1; }

.card-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); padding: 3px 5px;
  border-radius: 5px; font-size: 0.78rem; line-height: 1;
  transition: all 0.15s;
}
.card-btn:hover           { background: var(--surface); color: var(--neon-cyan); text-shadow: 0 0 6px var(--neon-cyan); }
.card-btn.del:hover       { color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); }

.card-desc {
  font-family: var(--font-mono);
  font-size: 0.7rem; color: var(--text-muted); line-height: 1.5;
  margin-bottom: 0.6rem;
}

.card-meta {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  align-items: center; margin-top: 0.6rem;
}

.priority-badge {
  display: inline-flex; align-items: center; gap: 0.3rem;
  font-size: 0.64rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 20px; border: 1px solid;
}

.priority-badge.alta   { color: var(--high); background: var(--high-bg); border-color: rgba(255,45,120,0.3); text-shadow: 0 0 6px var(--high); }
.priority-badge.media  { color: var(--mid);  background: var(--mid-bg);  border-color: rgba(245,255,0,0.25); text-shadow: 0 0 6px var(--mid); }
.priority-badge.baja   { color: var(--low);  background: var(--low-bg);  border-color: rgba(0,255,159,0.25); text-shadow: 0 0 6px var(--low); }

.priority-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

.date-badge {
  display: inline-flex; align-items: center; gap: 0.3rem;
  font-family: var(--font-mono); font-size: 0.62rem;
  color: var(--text-muted); padding: 2px 7px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px;
}

.date-badge.overdue { color: var(--neon-pink); border-color: rgba(255,45,120,0.3); text-shadow: 0 0 6px var(--neon-pink); }

.user-badge {
  display: inline-flex; align-items: center; gap: 0.3rem;
  font-size: 0.62rem; font-weight: 700;
  padding: 2px 7px; border-radius: 20px;
  border: 1px solid;
  font-family: var(--font-mono);
}

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 2rem 1rem; color: var(--text-dim);
  font-size: 0.72rem; font-family: var(--font-mono); text-align: center; gap: 0.4rem;
}

/* ── GANTT ── */
#view-gantt { padding: 2rem 2.5rem 3rem; }

.gantt-header-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem;
}

.gantt-title {
  font-size: 1rem; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--neon-purple); text-shadow: 0 0 12px var(--neon-purple);
}

.gantt-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: auto;
  position: relative;
}

.gantt-inner { min-width: 900px; }

.gantt-head {
  display: grid;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 3;
  background: var(--surface);
}

.gantt-head::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
}

.gh-label {
  padding: 0.7rem 1rem;
  font-family: var(--font-mono); font-size: 0.65rem;
  color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase;
  border-right: 1px solid var(--border);
}

.gantt-days-head {
  display: flex; overflow: hidden;
}

.gantt-day-label {
  flex-shrink: 0;
  font-family: var(--font-mono); font-size: 0.58rem;
  color: var(--text-dim); text-align: center;
  padding: 0.7rem 0;
  border-right: 1px solid var(--border);
}

.gantt-day-label.today-col {
  color: var(--neon-cyan); text-shadow: 0 0 6px var(--neon-cyan);
  background: rgba(0,245,255,0.05);
}

.gantt-day-label.weekend { color: rgba(90,92,120,0.5); }

.gantt-row {
  display: grid;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}

.gantt-row:hover { background: rgba(255,255,255,0.015); }
.gantt-row:last-child { border-bottom: none; }

.gr-info {
  padding: 0.7rem 1rem;
  display: flex; flex-direction: column; gap: 0.25rem;
  border-right: 1px solid var(--border);
}

.gr-title { font-size: 0.82rem; font-weight: 700; line-height: 1.2; }
.gr-user  { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted); }

.gr-timeline { position: relative; display: flex; align-items: center; }

.gantt-bar-area { flex: 1; height: 100%; position: relative; display: flex; }

.gantt-cell {
  flex-shrink: 0; height: 100%;
  border-right: 1px solid rgba(30,30,46,0.6);
  position: relative;
}

.gantt-cell.today-col { background: rgba(0,245,255,0.04); }
.gantt-cell.weekend   { background: rgba(0,0,0,0.15); }

.gantt-bar {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  height: 22px; border-radius: 4px;
  display: flex; align-items: center;
  padding: 0 8px;
  font-family: var(--font-mono); font-size: 0.6rem; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 2; cursor: default;
  transition: filter 0.15s, transform 0.15s;
}

.gantt-bar:hover { filter: brightness(1.2); transform: translateY(-50%) scaleY(1.08); }

.gantt-bar.alta  { background: rgba(255,45,120,0.25); border: 1px solid var(--neon-pink); color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); box-shadow: 0 0 10px rgba(255,45,120,0.25); }
.gantt-bar.media { background: rgba(245,255,0,0.15);  border: 1px solid var(--neon-yellow); color: var(--neon-yellow); text-shadow: 0 0 6px var(--neon-yellow); box-shadow: 0 0 10px rgba(245,255,0,0.2); }
.gantt-bar.baja  { background: rgba(0,255,159,0.15);  border: 1px solid var(--neon-green);  color: var(--neon-green);  text-shadow: 0 0 6px var(--neon-green);  box-shadow: 0 0 10px rgba(0,255,159,0.2); }

.today-line {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan);
  z-index: 5; pointer-events: none;
}

.today-line-label {
  position: absolute; top: 4px;
  background: var(--neon-cyan); color: #000;
  font-family: var(--font-mono); font-size: 0.55rem; font-weight: 700;
  padding: 1px 4px; border-radius: 3px;
  transform: translateX(-50%);
  white-space: nowrap;
}

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}

.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface);
  border: 1px solid var(--neon-cyan);
  box-shadow: 0 0 40px rgba(0,245,255,0.15), 0 40px 80px rgba(0,0,0,0.6);
  border-radius: 14px;
  width: 500px; max-width: 96vw;
  padding: 2rem;
  transform: translateY(20px) scale(0.97);
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  max-height: 92vh; overflow-y: auto;
}

.modal-overlay.open .modal { transform: none; }

.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }

.modal-title {
  font-size: 1.1rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan);
}

.modal-close {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); width: 28px; height: 28px; border-radius: 6px;
  cursor: pointer; font-size: 0.9rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}

.modal-close:hover { color: var(--neon-pink); border-color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); }

.form-group { margin-bottom: 1rem; }

label {
  display: block;
  font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 0.4rem;
  font-family: var(--font-mono);
}

input[type="text"], input[type="date"], textarea, select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  padding: 0.6rem 0.85rem;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  resize: vertical;
}

input[type="date"] { color-scheme: dark; }

input:focus, textarea:focus, select:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 2px rgba(0,245,255,0.1), 0 0 12px rgba(0,245,255,0.1);
}

select option { background: var(--surface2); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.priority-selector { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.5rem; }

.priority-opt {
  display: flex; align-items: center; justify-content: center; gap: 0.35rem;
  padding: 0.5rem; border-radius: 7px; border: 1px solid var(--border);
  cursor: pointer; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em;
  transition: all 0.15s; user-select: none; color: var(--text-muted);
  font-family: var(--font-mono);
}

.priority-opt input { display: none; }

.priority-opt.alta:has(input:checked), .priority-opt.alta:hover {
  background: var(--high-bg); border-color: rgba(255,45,120,0.4);
  color: var(--high); text-shadow: 0 0 6px var(--high);
  box-shadow: 0 0 10px rgba(255,45,120,0.2);
}

.priority-opt.media:has(input:checked), .priority-opt.media:hover {
  background: var(--mid-bg); border-color: rgba(245,255,0,0.35);
  color: var(--mid); text-shadow: 0 0 6px var(--mid);
  box-shadow: 0 0 10px rgba(245,255,0,0.15);
}

.priority-opt.baja:has(input:checked), .priority-opt.baja:hover {
  background: var(--low-bg); border-color: rgba(0,255,159,0.3);
  color: var(--low); text-shadow: 0 0 6px var(--low);
  box-shadow: 0 0 10px rgba(0,255,159,0.15);
}

.modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }

.btn {
  padding: 0.6rem 1.3rem; border-radius: 7px;
  font-family: var(--font-main); font-weight: 700; font-size: 0.85rem;
  cursor: pointer; border: 1px solid; transition: all 0.15s;
  letter-spacing: 0.06em; text-transform: uppercase;
}

.btn-ghost {
  background: none; border-color: var(--border); color: var(--text-muted);
}
.btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }

.btn-primary {
  background: transparent; border-color: var(--neon-cyan); color: var(--neon-cyan);
  text-shadow: 0 0 8px var(--neon-cyan);
  box-shadow: 0 0 14px rgba(0,245,255,0.2);
}
.btn-primary:hover { background: rgba(0,245,255,0.1); box-shadow: 0 0 24px rgba(0,245,255,0.35); }

/* User colors */
.user-Ana    { color: var(--neon-cyan);   border-color: rgba(0,245,255,0.3); background: rgba(0,245,255,0.07); }
.user-Carlos { color: var(--neon-purple); border-color: rgba(191,0,255,0.3); background: rgba(191,0,255,0.07); }
.user-Laura  { color: var(--neon-pink);   border-color: rgba(255,45,120,0.3); background: rgba(255,45,120,0.07); }
.user-Marco  { color: var(--neon-yellow); border-color: rgba(245,255,0,0.3);  background: rgba(245,255,0,0.07); }
.user-Sofia  { color: var(--neon-green);  border-color: rgba(0,255,159,0.3);  background: rgba(0,255,159,0.07); }
.user-Diego  { color: var(--neon-orange); border-color: rgba(255,107,0,0.3);  background: rgba(255,107,0,0.07); }

@media (max-width: 900px) {
  header { padding: 1.2rem 1.2rem 0.9rem; }
  .board { grid-template-columns: 1fr; padding: 1rem 1.2rem; }
  #view-gantt { padding: 1rem 1.2rem; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>⬡ Kanban</h1>
    <p>Sistema de gestión · <span id="total-count">0</span> tareas activas</p>
  </div>
  <div class="header-right">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('board', this)">Tablero</button>
      <button class="tab-btn" onclick="switchView('gantt', this)">Gantt</button>
    </div>
    <button class="btn-add-main" onclick="openModal()">+ Nueva tarea</button>
  </div>
</header>

<!-- BOARD -->
<div id="view-board" class="view active">
  <div class="board" id="board">

    <div class="column" data-col="todo" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
      <div class="col-header">
        <div class="col-title-wrap"><span class="col-name">Por hacer</span></div>
        <span class="col-count" id="count-todo">0</span>
      </div>
      <div class="col-body" id="col-todo"><div class="drop-placeholder">Suelta aquí</div></div>
    </div>

    <div class="column" data-col="progress" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
      <div class="col-header">
        <div class="col-title-wrap"><span class="col-name">En progreso</span></div>
        <span class="col-count" id="count-progress">0</span>
      </div>
      <div class="col-body" id="col-progress"><div class="drop-placeholder">Suelta aquí</div></div>
    </div>

    <div class="column" data-col="done" ondragover="onDragOver(event)" ondrop="onDrop(event)" ondragleave="onDragLeave(event)">
      <div class="col-header">
        <div class="col-title-wrap"><span class="col-name">Completado</span></div>
        <span class="col-count" id="count-done">0</span>
      </div>
      <div class="col-body" id="col-done"><div class="drop-placeholder">Suelta aquí</div></div>
    </div>

  </div>
</div>

<!-- GANTT -->
<div id="view-gantt" class="view">
  <div class="gantt-header-bar">
    <div class="gantt-title">// Diagrama de Gantt</div>
    <div style="font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted)" id="gantt-range-label"></div>
  </div>
  <div class="gantt-wrap">
    <div class="gantt-inner" id="gantt-inner"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-head">
      <h2 class="modal-title" id="modal-title-text">Nueva Tarea</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-group">
      <label>Título</label>
      <input type="text" id="input-title" placeholder="Nombre de la tarea..." maxlength="80">
    </div>

    <div class="form-group">
      <label>Descripción</label>
      <textarea id="input-desc" rows="2" placeholder="Breve descripción..."></textarea>
    </div>

    <div class="form-group">
      <label>Prioridad</label>
      <div class="priority-selector">
        <label class="priority-opt alta"><input type="radio" name="priority" value="alta" checked><span class="priority-dot"></span>Alta</label>
        <label class="priority-opt media"><input type="radio" name="priority" value="media"><span class="priority-dot"></span>Media</label>
        <label class="priority-opt baja"><input type="radio" name="priority" value="baja"><span class="priority-dot"></span>Baja</label>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Fecha de inicio</label>
        <input type="date" id="input-start">
      </div>
      <div class="form-group">
        <label>Fecha de fin</label>
        <input type="date" id="input-end">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Responsable</label>
        <select id="input-user">
          <option value="Ana">Ana</option>
          <option value="Carlos">Carlos</option>
          <option value="Laura">Laura</option>
          <option value="Marco">Marco</option>
          <option value="Sofia">Sofia</option>
          <option value="Diego">Diego</option>
        </select>
      </div>
      <div class="form-group">
        <label>Columna</label>
        <select id="input-col">
          <option value="todo">Por hacer</option>
          <option value="progress">En progreso</option>
          <option value="done">Completado</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="modal-btn" onclick="saveCard()">Crear tarea</button>
    </div>
  </div>
</div>

<script>
// ── Utils ──────────────────────────────────────────────────────────────────
function uid() { return '_' + Math.random().toString(36).slice(2,9); }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { if(!d) return ''; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function today() { return new Date().toISOString().slice(0,10); }
function addDays(d, n) { const dt = new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }

// ── Initial data ────────────────────────────────────────────────────────────
const T = today();
const INITIAL = [
  { id: uid(), title: 'Diseñar wireframes', desc: 'Pantalla principal y flujos de usuario.', priority: 'alta', col: 'todo', start: T, end: addDays(T,5), user: 'Ana' },
  { id: uid(), title: 'Revisar documentación', desc: 'Actualizar el README del proyecto.', priority: 'baja', col: 'todo', start: addDays(T,2), end: addDays(T,4), user: 'Marco' },
  { id: uid(), title: 'Integrar API de pagos', desc: 'Conectar Stripe y probar el checkout.', priority: 'alta', col: 'progress', start: addDays(T,-3), end: addDays(T,4), user: 'Carlos' },
  { id: uid(), title: 'Refactorizar auth', desc: 'Separar lógica en un servicio independiente.', priority: 'media', col: 'progress', start: addDays(T,-1), end: addDays(T,3), user: 'Laura' },
  { id: uid(), title: 'Escribir tests', desc: 'Cubrir 80% de servicios principales.', priority: 'media', col: 'todo', start: addDays(T,4), end: addDays(T,9), user: 'Sofia' },
  { id: uid(), title: 'Deploy producción', desc: 'Publicar versión 1.0 en producción.', priority: 'alta', col: 'done', start: addDays(T,-8), end: addDays(T,-2), user: 'Diego' },
  { id: uid(), title: 'Configurar CI/CD', desc: 'Automatizar pipeline con GitHub Actions.', priority: 'baja', col: 'done', start: addDays(T,-12), end: addDays(T,-6), user: 'Ana' },
];

// ── State ──────────────────────────────────────────────────────────────────
let cards = [];
let dragId = null;
let editId = null;
let currentView = 'board';

function load() {
  const s = localStorage.getItem('kanban-neon-v2');
  cards = s ? JSON.parse(s) : [...INITIAL];
  render();
}

function save() { localStorage.setItem('kanban-neon-v2', JSON.stringify(cards)); }

// ── Views ──────────────────────────────────────────────────────────────────
function switchView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  btn.classList.add('active');
  if (view === 'gantt') renderGantt();
}

// ── Render Board ───────────────────────────────────────────────────────────
function render() {
  ['todo','progress','done'].forEach(col => {
    const body = document.getElementById('col-' + col);
    const ph = body.querySelector('.drop-placeholder');
    body.innerHTML = '';
    body.appendChild(ph);

    const colCards = cards.filter(c => c.col === col);
    document.getElementById('count-' + col).textContent = colCards.length;

    if (!colCards.length) {
      const e = document.createElement('div');
      e.className = 'empty-state';
      e.innerHTML = '<div style="font-size:1.5rem;opacity:.3">◌</div><div>Sin tareas</div>';
      body.appendChild(e);
    } else {
      colCards.forEach(c => body.appendChild(makeCard(c)));
    }
  });
  document.getElementById('total-count').textContent = cards.length;
  if (currentView === 'gantt') renderGantt();
  save();
}

function makeCard(c) {
  const el = document.createElement('div');
  el.className = 'card';
  el.setAttribute('draggable','true');
  el.setAttribute('data-id', c.id);
  el.setAttribute('data-priority', c.priority);

  const prioLabel = { alta:'Alta', media:'Media', baja:'Baja' };
  const now = today();
  const overdue = c.end && c.end < now && c.col !== 'done';

  let dateHtml = '';
  if (c.start || c.end) {
    dateHtml = `<span class="date-badge ${overdue ? 'overdue' : ''}">
      📅 ${c.start ? fmtDate(c.start) : '—'} → ${c.end ? fmtDate(c.end) : '—'}
    </span>`;
  }

  const userClass = c.user ? `user-${c.user}` : '';
  const userHtml = c.user ? `<span class="user-badge ${userClass}">⬡ ${escHtml(c.user)}</span>` : '';

  el.innerHTML = `
    <div class="card-top">
      <div class="card-title">${escHtml(c.title)}</div>
      <div class="card-actions">
        <button class="card-btn" onclick="openEditModal('${c.id}')">✎</button>
        <button class="card-btn del" onclick="deleteCard('${c.id}')">✕</button>
      </div>
    </div>
    ${c.desc ? `<div class="card-desc">${escHtml(c.desc)}</div>` : ''}
    <div class="card-meta">
      <span class="priority-badge ${c.priority}"><span class="priority-dot"></span>${prioLabel[c.priority]}</span>
      ${userHtml}
    </div>
    ${dateHtml ? `<div class="card-meta" style="margin-top:0.35rem">${dateHtml}</div>` : ''}
  `;

  el.addEventListener('dragstart', e => { dragId = c.id; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragId=null; document.querySelectorAll('.column').forEach(c=>c.classList.remove('drag-over')); });
  return el;
}

// ── Drag & Drop ────────────────────────────────────────────────────────────
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect='move'; e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over'); }
function onDrop(e) {
  e.preventDefault();
  const col = e.currentTarget;
  col.classList.remove('drag-over');
  if (dragId) {
    const card = cards.find(c => c.id === dragId);
    if (card && card.col !== col.dataset.col) { card.col = col.dataset.col; render(); }
  }
}

// ── CRUD ───────────────────────────────────────────────────────────────────
function deleteCard(id) { cards = cards.filter(c => c.id !== id); render(); }

function saveCard() {
  const title = document.getElementById('input-title').value.trim();
  if (!title) { document.getElementById('input-title').focus(); return; }

  const data = {
    title,
    desc: document.getElementById('input-desc').value.trim(),
    priority: document.querySelector('input[name="priority"]:checked').value,
    col: document.getElementById('input-col').value,
    start: document.getElementById('input-start').value,
    end: document.getElementById('input-end').value,
    user: document.getElementById('input-user').value,
  };

  if (editId) { Object.assign(cards.find(c => c.id === editId), data); editId = null; }
  else cards.push({ id: uid(), ...data });

  render(); closeModal();
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(colDefault='todo') {
  editId = null;
  document.getElementById('modal-title-text').textContent = 'Nueva Tarea';
  document.getElementById('modal-btn').textContent = 'Crear Tarea';
  document.getElementById('input-title').value = '';
  document.getElementById('input-desc').value = '';
  document.getElementById('input-col').value = colDefault;
  document.getElementById('input-start').value = today();
  document.getElementById('input-end').value = addDays(today(), 5);
  document.getElementById('input-user').value = 'Ana';
  document.querySelector('input[name="priority"][value="alta"]').checked = true;
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('input-title').focus(), 180);
}

function openEditModal(id) {
  const c = cards.find(x => x.id === id); if (!c) return;
  editId = id;
  document.getElementById('modal-title-text').textContent = 'Editar Tarea';
  document.getElementById('modal-btn').textContent = 'Guardar';
  document.getElementById('input-title').value = c.title;
  document.getElementById('input-desc').value = c.desc || '';
  document.getElementById('input-col').value = c.col;
  document.getElementById('input-start').value = c.start || '';
  document.getElementById('input-end').value = c.end || '';
  document.getElementById('input-user').value = c.user || 'Ana';
  document.querySelector(`input[name="priority"][value="${c.priority}"]`).checked = true;
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('input-title').focus(), 180);
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); editId = null; }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.ctrlKey && document.getElementById('modal-overlay').classList.contains('open')) saveCard();
});

// ── Gantt ──────────────────────────────────────────────────────────────────
function renderGantt() {
  const inner = document.getElementById('gantt-inner');
  inner.innerHTML = '';

  const hasDates = cards.filter(c => c.start && c.end);
  if (!hasDates.length) {
    inner.innerHTML = '<div style="padding:3rem;text-align:center;font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted)">// Sin tareas con fechas definidas</div>';
    return;
  }

  // Compute date range
  const allDates = hasDates.flatMap(c => [c.start, c.end]);
  let minD = allDates.reduce((a,b) => a < b ? a : b);
  let maxD = allDates.reduce((a,b) => a > b ? a : b);
  minD = addDays(minD, -2);
  maxD = addDays(maxD, 3);

  const days = [];
  let cur = minD;
  while (cur <= maxD) { days.push(cur); cur = addDays(cur, 1); }

  document.getElementById('gantt-range-label').textContent = `${fmtDate(minD)} — ${fmtDate(maxD)} · ${days.length} días`;

  const COL_W = 34; // px per day
  const INFO_W = 220;
  const totalW = INFO_W + days.length * COL_W;
  inner.style.minWidth = totalW + 'px';

  const tod = today();
  const todIdx = days.indexOf(tod);

  // Header
  const head = document.createElement('div');
  head.className = 'gantt-head';
  head.style.gridTemplateColumns = `${INFO_W}px 1fr`;

  const ghLabel = document.createElement('div');
  ghLabel.className = 'gh-label';
  ghLabel.textContent = 'TAREA';

  const daysHead = document.createElement('div');
  daysHead.className = 'gantt-days-head';

  days.forEach(d => {
    const dt = new Date(d + 'T12:00:00');
    const dow = dt.getDay();
    const isWknd = dow === 0 || dow === 6;
    const isToday = d === tod;
    const span = document.createElement('div');
    span.className = 'gantt-day-label' + (isToday ? ' today-col' : '') + (isWknd ? ' weekend' : '');
    span.style.width = COL_W + 'px';
    const dd = d.slice(8);
    span.innerHTML = isToday ? `<strong>${dd}</strong>` : dd;
    daysHead.appendChild(span);
  });

  head.appendChild(ghLabel);
  head.appendChild(daysHead);
  inner.appendChild(head);

  // Rows
  hasDates.forEach(c => {
    const row = document.createElement('div');
    row.className = 'gantt-row';
    row.style.gridTemplateColumns = `${INFO_W}px 1fr`;
    row.style.minHeight = '50px';

    // Info
    const info = document.createElement('div');
    info.className = 'gr-info';
    const userClass = c.user ? `user-${c.user}` : '';
    info.innerHTML = `
      <div class="gr-title">${escHtml(c.title)}</div>
      <div class="gr-user">${c.user ? `<span class="user-badge ${userClass}" style="font-size:.58rem;padding:1px 5px">⬡ ${escHtml(c.user)}</span>` : ''}</div>
    `;

    // Timeline
    const timeline = document.createElement('div');
    timeline.className = 'gr-timeline';
    timeline.style.position = 'relative';
    timeline.style.minHeight = '50px';

    // Cells background
    const cellsWrap = document.createElement('div');
    cellsWrap.style.cssText = 'display:flex;position:absolute;inset:0;';

    days.forEach(d => {
      const dt = new Date(d + 'T12:00:00');
      const dow = dt.getDay();
      const isWknd = dow === 0 || dow === 6;
      const isToday2 = d === tod;
      const cell = document.createElement('div');
      cell.style.cssText = `flex-shrink:0;width:${COL_W}px;height:100%;border-right:1px solid rgba(30,30,46,0.6);`;
      if (isToday2) cell.style.background = 'rgba(0,245,255,0.04)';
      if (isWknd) cell.style.background = 'rgba(0,0,0,0.2)';
      cellsWrap.appendChild(cell);
    });

    // Bar
    const startIdx = days.indexOf(c.start);
    const endIdx = days.indexOf(c.end);

    if (startIdx >= 0 && endIdx >= 0) {
      const barLeft = startIdx * COL_W;
      const barW = (endIdx - startIdx + 1) * COL_W;
      const bar = document.createElement('div');
      bar.className = `gantt-bar ${c.priority}`;
      bar.style.left = barLeft + 'px';
      bar.style.width = barW + 'px';
      bar.title = `${c.title} | ${fmtDate(c.start)} → ${fmtDate(c.end)}`;
      bar.textContent = barW > 60 ? c.title : '';
      cellsWrap.appendChild(bar);
    }

    // Today line
    if (todIdx >= 0) {
      const tl = document.createElement('div');
      tl.className = 'today-line';
      tl.style.left = (todIdx * COL_W + COL_W/2) + 'px';
      cellsWrap.appendChild(tl);
    }

    timeline.appendChild(cellsWrap);
    row.appendChild(info);
    row.appendChild(timeline);
    inner.appendChild(row);
  });

  // Today label at top (on header)
  if (todIdx >= 0) {
    const tll = document.createElement('div');
    tll.className = 'today-line-label';
    tll.style.cssText = `position:absolute;top:6px;left:${INFO_W + todIdx * COL_W + COL_W/2}px;z-index:10;`;
    tll.textContent = 'HOY';
    inner.style.position = 'relative';
    inner.appendChild(tll);
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
load();
</script>
</body>
</html>
